[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seizuretransformer"
version = "0.1.0"
description = "Seizure detection and analysis using Transformer models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Brotli",
    "certifi",
    "charset-normalizer",
    "contourpy",
    "cycler",
    "decorator",
    "filelock",
    "fonttools",
    "gmpy2",
